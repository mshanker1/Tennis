document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"eb69a58b-e161-40e7-9171-77b7af09321b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin: 0; }\n  ::-webkit-scrollbar { width: 8px; height: 8px; }\n  ::-webkit-scrollbar-thumb { background: #D8D8D5; border-radius: 4px; }\n  input[type=\"time\"] { font-family: inherit; }\n<\u002Fstyle>\n<script src=\"ce421a0d-6e64-4128-98a3-31235b9705d8\"><\u002Fscript>\n<script src=\"d1776c5e-73a8-441e-aa59-fc3559a7e142\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #FAFAFA; color: #1A1A1A; min-height: 100vh; padding: 32px 40px 56px;\">\n\n  <div style=\"max-width: 980px; margin: 0 auto;\">\n\n    <div style=\"margin-bottom: 24px;\">\n      <div style=\"font-size: 26px; font-weight: 700; letter-spacing: -0.01em;\">Court Board<\u002Fdiv>\n      <div style=\"font-size: 14px; color: #767676; margin-top: 4px;\">Reservable window: today through {{ windowEndLabel }} — courts open up to 7 days ahead per club rule. Courts book in fixed windows: doubles 2 hours, singles 90 minutes. Mark the days you're free, then whoever grabs a court time locks in who's playing.<\u002Fdiv>\n      <div style=\"font-size: 12px; color: {{ syncColor }}; margin-top: 6px; font-weight: 600;\">{{ syncLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 16px; background: #fff; border: 1px solid #E3E3E1; border-radius: 8px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n        <label style=\"font-size: 11px; font-weight: 600; color: #767676; text-transform: uppercase; letter-spacing: 0.04em;\">You are<\u002Flabel>\n        <sc-raw-select value=\"{{ currentPlayer }}\" sc-camel-on-change=\"{{ onPlayerChange }}\" style=\"font-size: 14px; padding: 7px 10px; border-radius: 6px; border: 1px solid #D5D5D2; background: #fff; color: #1A1A1A; min-width: 160px;\">\n          <option value=\"\">Select your name<\u002Foption>\n          <sc-for list=\"{{ playerOptions }}\" as=\"p\" hint-placeholder-count=\"12\">\n            <option value=\"{{ p }}\">{{ p }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <details style=\"margin-bottom: 16px; background: #fff; border: 1px solid #E3E3E1; border-radius: 8px; padding: 12px 16px;\">\n      <summary style=\"font-size: 13px; font-weight: 700; cursor: pointer; color: #444;\">Manage players<\u002Fsummary>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-width: 320px;\">\n        <sc-for list=\"{{ rosterEditorList }}\" as=\"rp\" hint-placeholder-count=\"12\">\n          <div style=\"display: flex; gap: 6px; align-items: center;\">\n            <input type=\"text\" value=\"{{ rp.name }}\" sc-camel-on-change=\"{{ rp.onChange }}\" style=\"flex: 1; font-size: 13px; padding: 5px 8px; border-radius: 5px; border: 1px solid #D5D5D2;\">\n            <div sc-camel-on-click=\"{{ rp.onRemove }}\" style=\"font-size: 11.5px; color: #B0463C; cursor: pointer; white-space: nowrap;\">Remove<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display: flex; gap: 6px; margin-top: 6px;\">\n          <input type=\"text\" placeholder=\"New player name\" value=\"{{ newPlayerName }}\" sc-camel-on-change=\"{{ onNewPlayerNameChange }}\" style=\"flex: 1; font-size: 13px; padding: 5px 8px; border-radius: 5px; border: 1px solid #D5D5D2;\">\n          <button sc-camel-on-click=\"{{ onAddPlayer }}\" style=\"font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 5px; border: none; background: oklch(0.42 0.09 155); color: #fff; cursor: pointer;\">Add<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdetails>\n\n    <sc-if value=\"{{ needsName }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background: oklch(0.95 0.025 155); border: 1px solid oklch(0.42 0.09 155); color: oklch(0.3 0.07 155); font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;\">Select your name above to mark availability or reserve a court.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 10px;\">Who's free this week<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 24px;\">\n      <sc-for list=\"{{ dayCards }}\" as=\"d\" hint-placeholder-count=\"8\">\n        <div style=\"{{ d.cardStyle }}\">\n          <div style=\"{{ d.headerStyle }}\">{{ d.wd }}<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #999; margin-bottom: 8px;\">{{ d.num }}<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n            <sc-for list=\"{{ d.availableChips }}\" as=\"chip\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ chip.onClick }}\" title=\"{{ chip.title }}\" style=\"{{ chip.style }}\">{{ chip.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 6px;\">\n            <sc-for list=\"{{ d.segmentButtons }}\" as=\"seg\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ seg.onClick }}\" style=\"{{ seg.style }}\">{{ seg.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border: 1px solid #E3E3E1; border-radius: 8px; padding: 18px; margin-bottom: 24px;\">\n      <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 14px;\">Reserve a court<\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <label style=\"font-size: 11px; font-weight: 600; color: #767676; text-transform: uppercase; letter-spacing: 0.04em;\">Day<\u002Flabel>\n          <sc-raw-select value=\"{{ draftDay }}\" sc-camel-on-change=\"{{ onDraftDayChange }}\" style=\"font-size: 14px; padding: 7px 10px; border-radius: 6px; border: 1px solid #D5D5D2; background: #fff; min-width: 130px;\">\n            <sc-for list=\"{{ dayOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n              <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <label style=\"font-size: 11px; font-weight: 600; color: #767676; text-transform: uppercase; letter-spacing: 0.04em;\">Type<\u002Flabel>\n          <div style=\"display: flex; border: 1px solid #D5D5D2; border-radius: 6px; overflow: hidden;\">\n            <button sc-camel-on-click=\"{{ onSetDoubles }}\" style=\"{{ doublesBtnStyle }}\">Doubles · 2h<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onSetSingles }}\" style=\"{{ singlesBtnStyle }}\">Singles · 90m<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <label style=\"font-size: 11px; font-weight: 600; color: #767676; text-transform: uppercase; letter-spacing: 0.04em;\">Start time<\u002Flabel>\n          <input type=\"time\" value=\"{{ draftTime }}\" sc-camel-on-change=\"{{ onDraftTimeChange }}\" style=\"font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid #D5D5D2; background: #fff;\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <label style=\"font-size: 11px; font-weight: 600; color: #767676; text-transform: uppercase; letter-spacing: 0.04em;\">Court (optional)<\u002Flabel>\n          <input type=\"text\" placeholder=\"e.g. 2\" value=\"{{ draftCourt }}\" sc-camel-on-change=\"{{ onDraftCourtChange }}\" style=\"font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid #D5D5D2; background: #fff; width: 90px;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 11px; font-weight: 600; color: #767676; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px;\">Players — tap to add ({{ selectedCount }}/{{ requiredCount }}). Highlighted names said they're free that day.<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;\">\n        <sc-for list=\"{{ rosterChips }}\" as=\"c\" hint-placeholder-count=\"12\">\n          <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.name }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ onConfirm }}\" style=\"{{ confirmBtnStyle }}\">Confirm reservation ({{ selectedCount }}/{{ requiredCount }})<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n      <div style=\"background: #fff; border: 1px solid #E3E3E1; border-radius: 8px; padding: 18px;\">\n        <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 12px;\">Your games this week<\u002Fdiv>\n        <sc-if value=\"{{ hasMyMatches }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ myMatchesList }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <div style=\"display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; background: oklch(0.97 0.012 155); border-radius: 6px; font-size: 13px;\">\n                <div style=\"font-weight: 700; min-width: 56px;\">{{ m.dayLabel }}<\u002Fdiv>\n                <div style=\"color: #767676; min-width: 118px;\">{{ m.timeRange }}<\u002Fdiv>\n                <div style=\"color: #444;\">{{ m.typeLabel }} with {{ m.others }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"{{ emptyMineStyle }}\">No confirmed games yet — reserve a court above.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fff; border: 1px solid #E3E3E1; border-radius: 8px; padding: 18px;\">\n        <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 12px;\">Full club schedule — {{ allMatchesCount }} confirmed<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto;\">\n          <sc-for list=\"{{ allMatchesList }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #F0F0EE; font-size: 12.5px;\">\n              <div style=\"font-weight: 700; min-width: 52px;\">{{ m.dayLabel }}<\u002Fdiv>\n              <div style=\"color: #767676; min-width: 108px;\">{{ m.timeRange }}<\u002Fdiv>\n              <div style=\"color: #767676; min-width: 40px;\">{{ m.courtLabel }}<\u002Fdiv>\n              <div style=\"color: #444; flex: 1;\">{{ m.playersLabel }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ m.onCancel }}\" style=\"color: #B0463C; font-size: 11.5px; cursor: pointer; white-space: nowrap;\">Cancel<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst ACCENT = 'oklch(0.42 0.09 155)';\nconst ACCENT_LIGHT = 'oklch(0.95 0.025 155)';\nconst TEXT = '#1A1A1A';\nconst MUTED = '#767676';\n\nconst FIREBASE_CONFIG = {\n  apiKey: \"AIzaSyA8tmQ1KhqTyzaa0mHgGf8vM51f7XydNbw\",\n  authDomain: \"tennis-schedule-5688e.firebaseapp.com\",\n  databaseURL: \"https://tennis-schedule-5688e-default-rtdb.firebaseio.com/\",\n  projectId: \"tennis-schedule-5688e\",\n  storageBucket: \"tennis-schedule-5688e.firebasestorage.app\",\n  messagingSenderId: \"495004606574\",\n  appId: \"1:495004606574:web:720e0c8a9dd7a77d90c67f\",\n};\n\nclass Component extends DCLogic {\n  PLAYERS = ['Alex', 'Priya', 'Marcus', 'Dana', 'Sam', 'Yuki', 'Chris', 'Nina', 'Owen', 'Tara', 'Leo', 'Maya'];\n\n  state = {\n    roster: [],\n    availability: {},\n    reservations: [],\n    currentPlayer: null,\n    draftDay: 0,\n    draftType: 'doubles',\n    draftTime: '18:00',\n    draftCourt: '',\n    draftPlayers: [],\n    newPlayerName: '',\n    synced: false,\n  };\n\n  componentDidMount() {\n    const currentPlayer = localStorage.getItem('courtboard_player') || null;\n    this.setState({ currentPlayer });\n    this.initFirebase(0);\n  }\n\n  initFirebase(attempt) {\n    if (typeof firebase === 'undefined' || !firebase.database) {\n      if (attempt > 100) return;\n      setTimeout(() => this.initFirebase(attempt + 1), 100);\n      return;\n    }\n    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);\n    this.db = firebase.database(app);\n\n    this.db.ref('roster').on('value', snap => {\n      const val = snap.val();\n      if (val) this.setState({ roster: val, synced: true });\n      else this.db.ref('roster').set(this.PLAYERS.slice());\n    });\n    this.db.ref('availability').on('value', snap => {\n      const val = snap.val();\n      if (val) this.setState({ availability: this.migrateAvailability(val), synced: true });\n      else this.db.ref('availability').set(this.generateSeedAvailability());\n    });\n    this.db.ref('reservations').on('value', snap => {\n      const val = snap.val();\n      if (val) this.setState({ reservations: Array.isArray(val) ? val : Object.values(val), synced: true });\n      else this.db.ref('reservations').set(this.generateSeedReservations());\n    });\n  }\n\n  renamePlayer(oldName, newName) {\n    if (!newName || oldName === newName) return;\n    const roster = this.state.roster.map(n => (n === oldName ? newName : n));\n    const availability = {};\n    Object.keys(this.state.availability).forEach(k => {\n      const day = this.state.availability[k] || {};\n      const swap = arr => (arr || []).map(n => (n === oldName ? newName : n));\n      availability[k] = { allDay: swap(day.allDay), morning: swap(day.morning), afternoon: swap(day.afternoon), evening: swap(day.evening) };\n    });\n    const reservations = this.state.reservations.map(r => ({ ...r, players: r.players.map(p => (p === oldName ? newName : p)) }));\n    const currentPlayer = this.state.currentPlayer === oldName ? newName : this.state.currentPlayer;\n    const draftPlayers = this.state.draftPlayers.map(p => (p === oldName ? newName : p));\n    this.setState({ currentPlayer, draftPlayers });\n    if (currentPlayer) localStorage.setItem('courtboard_player', currentPlayer);\n    this.db.ref('roster').set(roster);\n    this.db.ref('availability').set(availability);\n    this.db.ref('reservations').set(reservations);\n  }\n\n  addPlayer() {\n    const name = (this.state.newPlayerName || '').trim();\n    if (!name || this.state.roster.includes(name)) return;\n    const roster = this.state.roster.concat([name]);\n    this.setState({ newPlayerName: '' });\n    this.db.ref('roster').set(roster);\n  }\n\n  removePlayer(name) {\n    const roster = this.state.roster.filter(n => n !== name);\n    const availability = {};\n    Object.keys(this.state.availability).forEach(k => {\n      const day = this.state.availability[k] || {};\n      availability[k] = {\n        allDay: (day.allDay || []).filter(n => n !== name),\n        morning: (day.morning || []).filter(n => n !== name),\n        afternoon: (day.afternoon || []).filter(n => n !== name),\n        evening: (day.evening || []).filter(n => n !== name),\n      };\n    });\n    const currentPlayer = this.state.currentPlayer === name ? null : this.state.currentPlayer;\n    const draftPlayers = this.state.draftPlayers.filter(p => p !== name);\n    this.setState({ currentPlayer, draftPlayers });\n    if (!currentPlayer) localStorage.removeItem('courtboard_player');\n    this.db.ref('roster').set(roster);\n    this.db.ref('availability').set(availability);\n  }\n\n  generateSeedAvailability() {\n    const availability = {};\n    for (let day = 0; day < 8; day++) {\n      availability[day] = { allDay: [], morning: [], afternoon: [], evening: [] };\n      this.PLAYERS.forEach((p, pi) => {\n        const seedVal = Math.sin(pi * 91.7 + day * 17.3) * 10000;\n        const r = seedVal - Math.floor(seedVal);\n        if (r < 0.15) availability[day].allDay.push(p);\n        else if (r < 0.25) availability[day].morning.push(p);\n        else if (r < 0.35) availability[day].afternoon.push(p);\n        else if (r < 0.42) availability[day].evening.push(p);\n      });\n    }\n    return availability;\n  }\n\n  migrateAvailability(val) {\n    const out = {};\n    Object.keys(val).forEach(k => {\n      const v = val[k];\n      out[k] = Array.isArray(v) ? { allDay: v, morning: [], afternoon: [], evening: [] } : { allDay: v.allDay || [], morning: v.morning || [], afternoon: v.afternoon || [], evening: v.evening || [] };\n    });\n    return out;\n  }\n\n  generateSeedReservations() {\n    const P = this.PLAYERS;\n    return [\n      { id: 'r1', dayIndex: 1, type: 'doubles', time: '18:00', court: '1', players: [P[0], P[1], P[2], P[3]] },\n      { id: 'r2', dayIndex: 2, type: 'singles', time: '07:00', court: '', players: [P[4], P[5]] },\n      { id: 'r3', dayIndex: 3, type: 'doubles', time: '19:00', court: '3', players: [P[6], P[7], P[0], P[8]] },\n      { id: 'r4', dayIndex: 5, type: 'doubles', time: '09:00', court: '', players: [P[9], P[10], P[11], P[1]] },\n      { id: 'r5', dayIndex: 6, type: 'singles', time: '17:30', court: '2', players: [P[2], P[3]] },\n    ];\n  }\n\n  setCurrentPlayer(name) {\n    this.setState({ currentPlayer: name });\n    localStorage.setItem('courtboard_player', name);\n  }\n\n  toggleAvailability(dayIndex, segment) {\n    if (!this.state.currentPlayer) return;\n    const availability = { ...this.state.availability };\n    const day = availability[dayIndex] || {};\n    const next = { allDay: (day.allDay || []).slice(), morning: (day.morning || []).slice(), afternoon: (day.afternoon || []).slice(), evening: (day.evening || []).slice() };\n    const wasIn = next[segment].includes(this.state.currentPlayer);\n    ['allDay', 'morning', 'afternoon', 'evening'].forEach(seg => {\n      const i = next[seg].indexOf(this.state.currentPlayer);\n      if (i >= 0) next[seg].splice(i, 1);\n    });\n    if (!wasIn) next[segment].push(this.state.currentPlayer);\n    availability[dayIndex] = next;\n    this.db.ref('availability').set(availability);\n  }\n\n  toggleDraftPlayer(name) {\n    const required = this.state.draftType === 'doubles' ? 4 : 2;\n    let players = this.state.draftPlayers.slice();\n    const idx = players.indexOf(name);\n    if (idx >= 0) players.splice(idx, 1);\n    else if (players.length < required) players.push(name);\n    this.setState({ draftPlayers: players });\n  }\n\n  setDraftType(type) {\n    const required = type === 'doubles' ? 4 : 2;\n    let players = this.state.draftPlayers.slice(0, required);\n    this.setState({ draftType: type, draftPlayers: players });\n  }\n\n  confirmReservation() {\n    const required = this.state.draftType === 'doubles' ? 4 : 2;\n    if (this.state.draftPlayers.length !== required || !this.state.draftTime) return;\n    const reservation = {\n      id: 'r' + Date.now(),\n      dayIndex: Number(this.state.draftDay),\n      type: this.state.draftType,\n      time: this.state.draftTime,\n      court: this.state.draftCourt,\n      players: this.state.draftPlayers.slice(),\n    };\n    const reservations = this.state.reservations.concat([reservation]);\n    this.setState({ draftPlayers: [], draftCourt: '' });\n    this.db.ref('reservations').set(reservations);\n  }\n\n  cancelReservation(id) {\n    const reservations = this.state.reservations.filter(r => r.id !== id);\n    this.db.ref('reservations').set(reservations);\n  }\n\n  weekday(d) {\n    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];\n  }\n\n  formatClock(totalMins) {\n    let h = Math.floor(totalMins / 60) % 24;\n    const m = totalMins % 60;\n    const suffix = h < 12 ? 'AM' : 'PM';\n    let hh = h % 12;\n    if (hh === 0) hh = 12;\n    return hh + ':' + String(m).padStart(2, '0') + ' ' + suffix;\n  }\n\n  timeRange(time, type) {\n    const [h, m] = time.split(':').map(Number);\n    const start = h * 60 + m;\n    const duration = type === 'doubles' ? 120 : 90;\n    return this.formatClock(start) + ' \\u2013 ' + this.formatClock(start + duration);\n  }\n\n  renderVals() {\n    const currentPlayer = this.state.currentPlayer;\n    const availability = this.state.availability || {};\n    const reservations = this.state.reservations || [];\n\n    const today = new Date();\n    const days = [];\n    for (let i = 0; i < 8; i++) {\n      days.push({ index: i, date: new Date(today.getFullYear(), today.getMonth(), today.getDate() + i), isToday: i === 0 });\n    }\n\n    const MORNING_TINT = 'oklch(0.93 0.035 155)';\n    const AFTERNOON_TINT = 'oklch(0.87 0.05 155)';\n    const EVENING_TINT = 'oklch(0.80 0.06 155)';\n    const SEG_DEFS = [\n      { key: 'allDay', label: 'All day' },\n      { key: 'morning', label: 'AM' },\n      { key: 'afternoon', label: 'Noon' },\n      { key: 'evening', label: 'Eve' },\n    ];\n\n    const dayCards = days.map(d => {\n      const raw = availability[d.index] || {};\n      const day = { allDay: raw.allDay || [], morning: raw.morning || [], afternoon: raw.afternoon || [], evening: raw.evening || [] };\n      const gradParts = [];\n      if ((day.morning || []).length) gradParts.push(MORNING_TINT + ' 0%, ' + MORNING_TINT + ' 33.33%');\n      else gradParts.push('#fff 0%, #fff 33.33%');\n      if ((day.afternoon || []).length) gradParts.push(AFTERNOON_TINT + ' 33.33%, ' + AFTERNOON_TINT + ' 66.66%');\n      else gradParts.push('#fff 33.33%, #fff 66.66%');\n      if ((day.evening || []).length) gradParts.push(EVENING_TINT + ' 66.66%, ' + EVENING_TINT + ' 100%');\n      else gradParts.push('#fff 66.66%, #fff 100%');\n      const bg = (day.morning.length || day.afternoon.length || day.evening.length) ? 'linear-gradient(to bottom, ' + gradParts.join(', ') + ')' : '#fff';\n\n      const allChips = [];\n      SEG_DEFS.forEach(seg => {\n        (day[seg.key] || []).forEach(name => {\n          const mine = name === currentPlayer;\n          allChips.push({\n            label: mine ? name + ' \\u2715 ' + (seg.key === 'allDay' ? '' : seg.label) : name + (seg.key === 'allDay' ? '' : ' \\u00b7 ' + seg.label),\n            title: mine ? 'Click to remove yourself' : name + ' — ' + seg.label,\n            onClick: mine ? () => this.toggleAvailability(d.index, seg.key) : undefined,\n            style: mine\n              ? { fontSize: '11.5px', color: ACCENT, background: '#fff', border: '1px solid ' + ACCENT, borderRadius: '4px', padding: '2px 6px', cursor: 'pointer', fontWeight: 600 }\n              : { fontSize: '11.5px', color: '#333', background: 'rgba(255,255,255,0.65)', borderRadius: '4px', padding: '2px 6px' },\n          });\n        });\n      });\n\n      const mySegment = SEG_DEFS.find(seg => (day[seg.key] || []).includes(currentPlayer));\n\n      return {\n        index: d.index,\n        wd: this.weekday(d.date),\n        num: String(d.date.getDate()),\n        cardStyle: { background: bg, border: '1px solid #E3E3E1', borderRadius: '8px', padding: '10px', minHeight: '160px', display: 'flex', flexDirection: 'column' },\n        headerStyle: { fontSize: '13px', fontWeight: d.isToday ? 800 : 600, color: d.isToday ? ACCENT : TEXT },\n        availableChips: allChips,\n        segmentButtons: SEG_DEFS.map(seg => {\n          const active = mySegment && mySegment.key === seg.key;\n          return {\n            label: seg.label,\n            style: {\n              fontSize: '10.5px', padding: '5px 2px', borderRadius: '4px', border: '1px solid ' + (active ? ACCENT : '#D5D5D2'),\n              background: active ? ACCENT : 'rgba(255,255,255,0.85)', color: active ? '#fff' : MUTED, fontWeight: 600,\n              cursor: currentPlayer ? 'pointer' : 'not-allowed', opacity: currentPlayer ? 1 : 0.5,\n            },\n            onClick: () => this.toggleAvailability(d.index, seg.key),\n          };\n        }),\n      };\n    });\n\n    const dayOptions = days.map(d => ({ value: d.index, label: this.weekday(d.date) + ' ' + d.date.getDate() + (d.isToday ? ' (Today)' : '') }));\n\n    const draftDay = this.state.draftDay;\n    const draftType = this.state.draftType;\n    const draftPlayers = this.state.draftPlayers;\n    const required = draftType === 'doubles' ? 4 : 2;\n    const draftDayAvail = availability[draftDay] || {};\n    const availableToday = [].concat(draftDayAvail.allDay || [], draftDayAvail.morning || [], draftDayAvail.afternoon || [], draftDayAvail.evening || []);\n\n    const roster = this.state.roster;\n    const rosterChips = roster.map(name => {\n      const selected = draftPlayers.includes(name);\n      const isAvail = availableToday.includes(name);\n      let style;\n      if (selected) style = { padding: '6px 12px', borderRadius: '16px', fontSize: '13px', fontWeight: 700, background: ACCENT, color: '#fff', cursor: 'pointer' };\n      else if (isAvail) style = { padding: '6px 12px', borderRadius: '16px', fontSize: '13px', fontWeight: 600, background: ACCENT_LIGHT, color: ACCENT, border: '1.5px solid ' + ACCENT, cursor: 'pointer' };\n      else style = { padding: '6px 12px', borderRadius: '16px', fontSize: '13px', fontWeight: 500, background: '#F5F5F3', color: MUTED, border: '1px solid #E3E3E1', cursor: 'pointer' };\n      return { name, style, onClick: () => this.toggleDraftPlayer(name) };\n    });\n\n    const activeBtn = { flex: 1, padding: '7px 12px', fontSize: '13px', fontWeight: 700, border: 'none', background: ACCENT, color: '#fff', cursor: 'pointer', whiteSpace: 'nowrap' };\n    const inactiveBtn = { flex: 1, padding: '7px 12px', fontSize: '13px', fontWeight: 500, border: 'none', background: '#fff', color: MUTED, cursor: 'pointer', whiteSpace: 'nowrap' };\n\n    const canConfirm = draftPlayers.length === required;\n    const confirmBtnStyle = {\n      padding: '10px 20px', fontSize: '13.5px', fontWeight: 700, borderRadius: '6px', border: 'none',\n      background: canConfirm ? ACCENT : '#E3E3E1', color: canConfirm ? '#fff' : '#999', cursor: canConfirm ? 'pointer' : 'not-allowed',\n    };\n\n    const sorted = reservations.slice().sort((a, b) => {\n      if (a.dayIndex !== b.dayIndex) return a.dayIndex - b.dayIndex;\n      return a.time.localeCompare(b.time);\n    });\n\n    const dayLabelShort = idx => this.weekday(days[idx].date) + ' ' + days[idx].date.getDate();\n\n    const allMatchesList = sorted.map(m => ({\n      dayLabel: dayLabelShort(m.dayIndex),\n      timeRange: this.timeRange(m.time, m.type),\n      courtLabel: m.court ? 'Ct ' + m.court : '\\u2014',\n      playersLabel: (m.type === 'doubles' ? 'Doubles — ' : 'Singles — ') + m.players.join(', '),\n      onCancel: () => this.cancelReservation(m.id),\n    }));\n\n    const myMatchesList = sorted\n      .filter(m => m.players.includes(currentPlayer))\n      .map(m => ({\n        dayLabel: dayLabelShort(m.dayIndex),\n        timeRange: this.timeRange(m.time, m.type),\n        typeLabel: m.type === 'doubles' ? 'Doubles' : 'Singles',\n        others: m.players.filter(p => p !== currentPlayer).join(', '),\n      }));\n\n    const windowEndLabel = this.weekday(days[7].date) + ', ' + days[7].date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });\n\n    const rosterEditorList = roster.map(name => ({\n      name,\n      onChange: e => this.renamePlayer(name, e.target.value),\n      onRemove: () => this.removePlayer(name),\n    }));\n\n    return {\n      syncLabel: this.state.synced ? '● Live — synced with the group' : '○ Connecting...',\n      syncColor: this.state.synced ? ACCENT : MUTED,\n      playerOptions: roster,\n      rosterEditorList,\n      newPlayerName: this.state.newPlayerName,\n      onNewPlayerNameChange: e => this.setState({ newPlayerName: e.target.value }),\n      onAddPlayer: () => this.addPlayer(),\n      currentPlayer: currentPlayer || '',\n      onPlayerChange: e => this.setCurrentPlayer(e.target.value),\n      needsName: !currentPlayer,\n      dayCards,\n      dayOptions,\n      draftDay,\n      onDraftDayChange: e => this.setState({ draftDay: Number(e.target.value) }),\n      doublesBtnStyle: draftType === 'doubles' ? activeBtn : inactiveBtn,\n      singlesBtnStyle: draftType === 'singles' ? activeBtn : inactiveBtn,\n      onSetDoubles: () => this.setDraftType('doubles'),\n      onSetSingles: () => this.setDraftType('singles'),\n      draftTime: this.state.draftTime,\n      onDraftTimeChange: e => this.setState({ draftTime: e.target.value }),\n      draftCourt: this.state.draftCourt,\n      onDraftCourtChange: e => this.setState({ draftCourt: e.target.value }),\n      rosterChips,\n      requiredCount: required,\n      selectedCount: draftPlayers.length,\n      confirmBtnStyle,\n      onConfirm: () => this.confirmReservation(),\n      windowEndLabel,\n      hasMyMatches: myMatchesList.length > 0,\n      myMatchesList,\n      emptyMineStyle: myMatchesList.length > 0 ? { display: 'none' } : { fontSize: '13px', color: MUTED, padding: '8px 0' },\n      allMatchesList,\n      allMatchesCount: allMatchesList.length,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
